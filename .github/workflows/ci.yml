name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'scripts/vercel-ignore.sh'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - 'scripts/vercel-ignore.sh'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The full test suite runs WITH coverage in one pass (v8 provider) so the
      # coverage ratchet in vitest.config.ts is enforced here — no separate
      # vitest run. A metric dropping below its floor fails this step. The
      # coverage/ report is uploaded below (if: always()) so a breach is
      # debuggable from the PR.
      - run: npm run coverage
      # Security regression tests are also exercised by `npm run coverage` above
      # (the `tests/security/` suite is part of the default vitest collection),
      # but this dedicated step re-runs them on their own so a Phase-3 regression
      # surfaces as a clearly-named failed check ("Security regression tests
      # failed") in the PR review UI rather than buried in the 1300+ lines of
      # general vitest output. Adding a NEW finding with a regression test
      # under tests/security/ is what keeps this gate honest.
      - name: Security regression tests
        run: npx vitest run tests/security/
      - name: Build (with first-load JS summary)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Surface first-load JS per route
        if: always()
        run: |
          {
            echo "## First-load JS per route"
            echo ""
            echo "Captured from \`next build\` stdout. Watch for jumps when adding deps (Zod, three.js, GSAP, Phaser) — pre-fix, every static page loaded ~98 kB of Zod due to module-load \`Schema.parse\` calls."
            echo ""
            echo '```'
            awk '/^Route \(app\)/{flag=1} flag{print} /server-rendered on demand/{flag=0; exit}' build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()  # upload even when the coverage threshold step failed, so the report is debuggable
        with:
          name: coverage
          path: coverage/
          retention-days: 14
